name: Desktop AOT and JIT

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            profile: WindowsAot
          - os: windows-latest
            platform: Windows
            profile: WindowsJit
          - os: ubuntu-latest
            platform: Linux
            profile: LinuxAot
          - os: ubuntu-latest
            platform: Linux
            profile: LinuxJit
          - os: macos-latest
            platform: MacOS
            profile: MacOSAot
          - os: macos-latest
            platform: MacOS
            profile: MacOSJit
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve runner-matching target RID
        run: |
          $osName = switch ('${{ matrix.platform }}') { Windows { 'win' } Linux { 'linux' } MacOS { 'osx' } }
          $archName = switch ($env:RUNNER_ARCH) { X64 { 'x64' } ARM64 { 'arm64' } default { throw "Unsupported runner architecture: $env:RUNNER_ARCH" } }
          "TARGET_RID=$osName-$archName" >> $env:GITHUB_ENV
      - name: Install Linux Native AOT toolchain
        if: runner.os == 'Linux' && matrix.profile == 'LinuxAot'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Verify target platform model
        run: ./build/Test-TargetPlatform.ps1
      - name: Publish application (restore uses the same profile)
        run: |
          dotnet publish OneLauncher.Desktop/OneLauncher.Desktop.csproj -p:PublishProfile=${{ matrix.profile }} -r $env:TARGET_RID -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish and run real UI and JSON smoke tests
        run: |
          dotnet publish tests/OneLauncher.AotSmoke/OneLauncher.AotSmoke.csproj -p:PublishProfile=${{ matrix.profile }} -r $env:TARGET_RID -o "$env:RUNNER_TEMP/onelauncher-smoke"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extension = if ($IsWindows) { '.exe' } else { '' }
          & "$env:RUNNER_TEMP/onelauncher-smoke/OneLauncher.AotSmoke$extension"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: OneLauncher-${{ matrix.profile }}-${{ runner.arch }}
          path: |
            publish/**
            !publish/**/*.pdb
