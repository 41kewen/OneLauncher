name: Desktop builds

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact_path: artifacts/win-x64/
          - os: ubuntu-22.04
            rid: linux-x64
            artifact_path: artifacts/linux-x64/OneLauncher-linux-x64.tar.gz*

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish Windows
        if: runner.os == 'Windows'
        run: dotnet publish OneLauncher.Desktop/OneLauncher.Desktop.csproj -c Release -r win-x64 --self-contained true -o artifacts/win-x64

      - name: Package Linux
        if: runner.os == 'Linux'
        run: bash scripts/publish-linux.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OneLauncher-${{ matrix.rid }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
